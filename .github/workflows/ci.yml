name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: bash -n passport && bash -n examples/*.sh
      - name: ShellCheck
        run: shellcheck -S warning passport examples/*.sh
      - name: Help and version
        run: ./passport --help && ./passport --version
